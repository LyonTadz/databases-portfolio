[project]
name = "databases-portfolio"
version = "0.1.0"
description = "HSBI Databases (DBS) coursework portfolio — local-first edition"
readme = "README.md"
authors = [
    { name = "Lyon Andres Dabu Tadeo", email = "lyontadeo.2006@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "datasette>=0.65.5",
    "duckdb>=1.5.6",
    "pydantic>=2.14.1",
    "sqlalchemy>=2.1.4",
    "sqlite-utils>=4.2.1",
]

[project.scripts]
databases-portfolio = "databases_portfolio:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
